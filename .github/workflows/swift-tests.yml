name: swift-tests

on:
  push:
    branches:
      - main
  pull_request:

# Least privilege: the job only reads the checkout. No token write scope is
# needed, and none is granted.
permissions:
  contents: read

jobs:
  test:
    name: swift-test-macos
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          # The provenance tests assert git ancestry of the legacy baseline
          # and the operating guide merge; a shallow clone would break them.
          fetch-depth: 0
      - name: Show toolchain
        run: swift --version
      - name: Run tests
        run: swift test
